name: CodeQL

# Static analysis for every language actually present in this repository.
# Results land in the Security tab and, on a public repo, are visible to anyone
# reading the project -- which is the point: a scan nobody can see proves
# nothing to a reader.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the queries improve even when the code does not. A finding
    # can appear in unchanged code the week after a new query ships.
    - cron: '0 3 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      # One language failing should not hide the results for the others.
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        # java-kotlin must be compiled for CodeQL to see
        # anything. Without a build the database is empty and the analysis
        # succeeds while having examined nothing.
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: "/language:${{ matrix.language }}"
