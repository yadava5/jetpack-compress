<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200"
     role="img" aria-label="jetpack-compress. Parallel gzip that is still, byte for byte, real gzip.">
  <title>jetpack-compress</title>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="-0.1" r="0.9">
      <stop offset="0" stop-color="#ff9e2c" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#ff9e2c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect x="1" y="1" width="798" height="198" rx="14"/></clipPath>
  </defs>
  <style>
    .word { font: 600 30px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            fill: #eceef1; letter-spacing: -0.5px; }
    .lead { font: 400 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            fill: #bfc4cb; }
    .byte { font: 500 11px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            fill: #bfc4cb; letter-spacing: 1px; }
  </style>

  <!-- Ink panel, faint systems grid, soft amber signal glow: the landing page, in miniature. -->
  <rect x="1" y="1" width="798" height="198" rx="14" fill="#0e1013" stroke="#23262d" stroke-width="1.5"/>
  <g clip-path="url(#panel)">
    <path d="M46,0V200M92,0V200M138,0V200M184,0V200M230,0V200M276,0V200M322,0V200M368,0V200M414,0V200M460,0V200M506,0V200M552,0V200M598,0V200M644,0V200M690,0V200M736,0V200M782,0V200M0,46H800M0,92H800M0,138H800M0,184H800"
          stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    <rect x="1" y="1" width="798" height="198" fill="url(#glow)"/>
  </g>

  <!-- Brand glyph from the site nav (fast-forward through parallel lanes). -->
  <g transform="translate(46,53) scale(1.4)" fill="none" stroke="#ff9e2c"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 9 H13"/><path d="M5 16 H18"/><path d="M5 23 H13"/>
    <path d="M13 9 L19 16 L13 23"/><path d="M19 16 H25"/>
  </g>
  <text x="102" y="86" class="word">jetpack-compress</text>
  <text x="46" y="128" class="lead">Parallel gzip that is still, byte for byte, <tspan fill="#ff9e2c">real gzip.</tspan></text>

  <!-- Signature: blocks compress concurrently (steel lanes), then stitch into one gzip member (amber bar) behind the 1f 8b header. -->
  <g>
    <g fill="rgba(107,165,196,0.13)" stroke="rgba(107,165,196,0.6)" stroke-width="1.2">
      <rect x="458" y="46" width="62" height="16" rx="4"/>
      <rect x="458" y="78" width="48" height="16" rx="4"/>
      <rect x="458" y="110" width="56" height="16" rx="4"/>
      <rect x="458" y="142" width="42" height="16" rx="4"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2">
      <path d="M520,54 C548,54 550,100 574,100"/>
      <path d="M506,86 C534,86 546,100 574,100"/>
      <path d="M514,118 C542,118 548,100 574,100"/>
      <path d="M500,150 C534,150 546,100 574,100"/>
    </g>
    <text x="574" y="82" class="byte">1f 8b</text>
    <rect x="574" y="92" width="24" height="16" rx="3" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
    <g fill="rgba(255,158,44,0.13)" stroke="rgba(255,158,44,0.55)" stroke-width="1.2">
      <rect x="598" y="92" width="46" height="16" rx="3"/>
      <rect x="644" y="92" width="36" height="16" rx="3"/>
      <rect x="680" y="92" width="42" height="16" rx="3"/>
      <rect x="722" y="92" width="32" height="16" rx="3"/>
    </g>
  </g>
</svg>
